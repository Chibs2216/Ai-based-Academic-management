<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal — UniBook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/pages.css">
    <link rel="stylesheet" href="../style/dashboard.css">
    <link rel="stylesheet" href="../style/portal.css">
    <link rel="stylesheet" href="../style/admin.css">
    <link rel="stylesheet" href="../style/app.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <svg class="icon" aria-hidden="true"><use href="#icon-logo"></use></svg>
            UniBook
        </div>

        <nav class="nav" aria-label="Student portal">
            <button class="nav-item" data-page="dashboard" data-title="Dashboard">
                <svg class="icon" aria-hidden="true"><use href="#icon-dashboard"></use></svg><span>Dashboard</span>
            </button>
            <button class="nav-item" data-page="courses" data-title="Courses">
                <svg class="icon" aria-hidden="true"><use href="#icon-courses"></use></svg><span>Courses</span>
            </button>
            <button class="nav-item" data-page="assignments" data-title="Assignments">
                <svg class="icon" aria-hidden="true"><use href="#icon-clipboard"></use></svg><span>Assignments</span>
            </button>
            <button class="nav-item" data-page="grades" data-title="Grades">
                <svg class="icon" aria-hidden="true"><use href="#icon-progress"></use></svg><span>Grades</span>
            </button>
            <button class="nav-item" data-page="roommate" data-title="Roommate Finder">
                <svg class="icon" aria-hidden="true"><use href="#icon-roommate"></use></svg><span>Roommate Finder</span>
            </button>
            <button class="nav-item" data-page="notifications" data-title="Notifications">
                <svg class="icon" aria-hidden="true"><use href="#icon-notifications"></use></svg><span>Notifications</span>
                <span class="nav-badge hidden"></span>
            </button>
            <button class="nav-item" data-page="settings" data-title="Settings">
                <svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg><span>Settings</span>
            </button>
        </nav>

        <button class="nav-item logout" data-action="logout">
            <svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg><span>Logout</span>
        </button>
    </aside>

    <main class="content">

        <header>
            <div>
                <h2 class="page-title">Dashboard</h2>
                <p class="welcome-text"></p>
            </div>
            <div class="header-actions">
                <button class="icon-btn bell-btn" data-action="openNotifications" aria-label="Notifications">
                    <svg class="icon" aria-hidden="true"><use href="#icon-notifications"></use></svg>
                    <span class="count bell-count hidden"></span>
                </button>
                <div class="profile">
                    <span class="avatar user-avatar" aria-hidden="true"></span>
                    <span class="user-name"></span>
                    <span class="tag tag--purple user-role">Student</span>
                </div>
            </div>
        </header>

        <section class="page" data-page="dashboard"><div id="dashboardRoot"></div></section>

        <section class="page hidden" data-page="courses">
            <div class="panel">
                <div class="section-head">
                    <h3>My Courses</h3>
                    <label class="visually-hidden" for="termFilter">Term</label>
                    <select class="field" id="termFilter" style="max-width: 220px;"></select>
                </div>
                <div id="coursesRoot"></div>
            </div>
        </section>

        <section class="page hidden" data-page="course-detail">
            <button class="back-link" data-action="backToCourses">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-arrow-right"></use></svg> Back to Courses
            </button>
            <div id="courseDetailRoot"></div>
        </section>

        <section class="page hidden" data-page="assignments">
            <div class="panel">
                <div class="section-head">
                    <h3>My Assignments</h3>
                    <label class="visually-hidden" for="assignmentFilter">Status</label>
                    <select class="field" id="assignmentFilter" style="max-width: 220px;">
                        <option value="">All</option>
                        <option value="todo">To do</option>
                        <option value="submitted">Submitted</option>
                        <option value="graded">Graded</option>
                    </select>
                </div>
                <div id="assignmentsRoot"></div>
            </div>
        </section>

        <section class="page hidden" data-page="assignment-detail">
            <button class="back-link" data-action="backToAssignments">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-arrow-right"></use></svg> Back to Assignments
            </button>
            <div id="assignmentDetailRoot"></div>
        </section>

        <section class="page hidden" data-page="grades"><div id="gradesRoot"></div></section>

        <section class="page hidden" data-page="roommate">
            <div class="panel tabs-wrapper">
                <h3 class="panel-title">
                    <svg class="icon" aria-hidden="true"><use href="#icon-roommate"></use></svg> Hostel Roommate Finder
                </h3>
                <div class="tab-bar" role="tablist">
                    <button class="active" role="tab" aria-selected="true" data-action="switchTab" data-tab="browse">Browse</button>
                    <button role="tab" aria-selected="false" data-action="switchTab" data-tab="listing">My Listing</button>
                    <button role="tab" aria-selected="false" data-action="switchTab" data-tab="shortlisted">Shortlisted</button>
                    <button role="tab" aria-selected="false" data-action="switchTab" data-tab="connections">Connections</button>
                </div>

                <div data-tab-content="browse">
                    <form class="filter-row" data-submit="searchHostel">
                        <select class="field" id="hostelBlockFilter" aria-label="Hostel block"><option value="">Any block</option></select>
                        <select class="field" id="hostelBudgetFilter" aria-label="Budget">
                            <option value="">Any budget</option>
                            <option value="0-3000">Up to ৳3,000</option>
                            <option value="3000-4000">৳3,000 - ৳4,000</option>
                            <option value="4000-5000">৳4,000 - ৳5,000</option>
                            <option value="5000-99999">Over ৳5,000</option>
                        </select>
                        <select class="field" id="hostelLifestyleFilter" aria-label="Lifestyle">
                            <option value="">Any lifestyle</option>
                            <option value="quiet">Quiet</option>
                            <option value="balanced">Balanced</option>
                            <option value="social">Social</option>
                        </select>
                        <select class="field" id="hostelGenderFilter" aria-label="Gender">
                            <option value="">Any gender</option>
                            <option value="female">Female</option>
                            <option value="male">Male</option>
                            <option value="other">Other</option>
                        </select>
                        <button class="btn btn-primary" type="submit">Search</button>
                    </form>
                    <div id="hostelResults"></div>
                </div>

                <div data-tab-content="listing" class="hidden"><div id="hostelListingRoot"></div></div>
                <div data-tab-content="shortlisted" class="hidden"><div id="hostelShortlistRoot"></div></div>
                <div data-tab-content="connections" class="hidden"><div id="hostelConnectionsRoot"></div></div>
            </div>
        </section>

        <section class="page hidden" data-page="notifications">
            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title"><svg class="icon" aria-hidden="true"><use href="#icon-notifications"></use></svg> Notifications</h3>
                    <button class="btn btn-ghost btn-sm" data-action="markAllNotificationsRead">Mark all as read</button>
                </div>
                <div class="notifications-list"></div>
            </div>
        </section>

        <section class="page hidden" data-page="settings"><div id="settingsRoot"></div></section>

    </main>

</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/shared/core.js"></script>
<script src="../js/shared/navigation.js"></script>
<script src="../js/shared/auth-guard.js"></script>
<script src="../js/shared/notifications.js"></script>
<script src="../js/shared/account-settings.js"></script>
<script src="../js/shared/charts.js"></script>
<script src="../js/student.js"></script>
<script src="../js/student/state.js"></script>
<script src="../js/student/dashboard.js"></script>
<script src="../js/student/courses.js"></script>
<script src="../js/student/assignments.js"></script>
<script src="../js/student/grades.js"></script>
<script src="../js/student/hostel.js"></script>
<script src="../js/student/portal.js"></script>

</body>
</html>
